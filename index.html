<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁雄心 · Steam 风格战略游戏</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================== 开始 / 主菜单界面 ===================== -->
  <section id="start-screen" class="screen">
    <div class="start-header">
      <div class="logo">钢铁雄心<span class="logo-en">HEARTS OF IRON</span></div>
      <div class="subtitle">简易战略模拟 · Steam 风格单机游戏</div>
    </div>

    <div class="start-grid">
      <!-- 左栏：剧本 + 国家（主要内容区） -->
      <div class="start-col start-col-main">
        <h2 class="pick-title">选择战役剧本</h2>
        <div id="scenario-cards" class="scenario-cards"></div>

        <h2 class="pick-title">选择你的国家</h2>
        <div id="country-cards" class="country-cards"></div>
      </div>

      <!-- 右栏：开局配置 + 开始按钮（吸顶常驻） -->
      <div class="start-col start-col-side">
        <h2 class="pick-title">意识形态</h2>
        <div class="ideo-wrap">
          <div id="ideo-select" class="ideo-select">
            <button class="ideo-btn selected" data-ideo="neu">中立</button>
            <button class="ideo-btn" data-ideo="dem">民主</button>
            <button class="ideo-btn" data-ideo="fas">法西斯</button>
            <button class="ideo-btn" data-ideo="com">共产主义</button>
          </div>
        </div>

        <h2 class="pick-title">选择难度</h2>
        <div class="diff-wrap">
          <div id="diff-select" class="diff-select"></div>
          <div id="diff-desc" class="diff-desc"></div>
        </div>

        <h2 class="pick-title">任命你的首席顾问</h2>
        <div id="advisor-cards" class="advisor-cards"></div>

        <div class="start-actions">
          <button id="btn-continue" class="btn btn-blue" hidden>继续上次</button>
          <button id="btn-start" class="btn btn-green" disabled>开始游戏</button>
          <button id="btn-help" class="btn btn-blue">玩法说明</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 游戏界面 ===================== -->
  <section id="game-screen" class="screen" hidden>
    <header id="topbar">
      <div class="tb-left">
        <span class="tb-logo">钢铁雄心</span>
        <button id="btn-menu" class="btn btn-mini">菜单</button>
      </div>
      <div class="tb-center">
        <span id="tb-date" class="tb-date"></span>
        <span id="tb-country" class="tb-country"></span>
        <span id="tb-save" class="tb-save"></span>
        <span id="tb-threat" class="tb-threat peace"></span>
      </div>
      <div class="tb-right" id="tb-resources"></div>
    </header>

    <div id="main">
      <!-- 左侧：国家状态面板 -->
      <aside id="left-panel" class="panel"></aside>

      <!-- 中央：地图 + 操作条 -->
      <section id="center">
        <div class="map-wrap">
          <svg id="map"></svg>
          <div class="map-tools">
            <button class="mt-btn mt-home-btn" id="mt-focus-player" title="回到我的国家">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
              <span>本国</span>
            </button>
            <div class="mt-group">
              <button class="mt-btn" data-region="world">全球</button>
              <button class="mt-btn" data-region="europe">欧洲</button>
              <button class="mt-btn" data-region="asia">亚洲</button>
              <button class="mt-btn" data-region="americas">美洲</button>
            </div>
            <div class="mt-group">
              <button class="mt-btn mt-mode active" data-mode="political" title="政治地图（归属国色）">政治</button>
              <button class="mt-btn mt-mode" data-mode="terrain" title="地形地图（地形着色）">地形</button>
            </div>
            <div class="mt-group">
              <button class="mt-btn mt-help-btn" id="mt-help" title="玩法说明">？</button>
              <button class="mt-btn" id="mt-zoom-in" title="放大">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <button class="mt-btn" id="mt-zoom-out" title="缩小">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
              </button>
              <button class="mt-btn" id="mt-zoom-reset" title="复位视图">复位</button>
            </div>
          </div>
        <div class="map-legend">
          <span class="lg-item"><i class="lg-ring lg-enemy"></i>交战</span>
          <span class="lg-item"><i class="lg-ring lg-ally"></i>同盟</span>
          <span class="lg-item"><i class="lg-ring lg-front"></i>前线</span>
          <span class="lg-item"><i class="lg-dot lg-self"></i>本国</span>
          <span class="lg-item"><i class="lg-star">★</i>首都</span>
        </div>
        <div id="map-tip" class="map-tip" hidden></div>
        </div>
        <div class="center-bar">
          <div id="selection-info" class="sel-info">点击地图上的省份进行选择</div>
          <button id="btn-endturn" class="btn btn-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            结束回合
          </button>
        </div>
      </section>

      <!-- 右侧：外交 / 军事 / 经济 / 科技 -->
      <aside id="right-panel" class="panel">
        <div id="province-panel" class="province-panel" hidden></div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="diplo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
            <span>外交</span>
            <span class="tab-badge" id="badge-diplo" hidden></span>
          </button>
          <button class="tab" data-tab="mil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
            <span>军事</span>
          </button>
          <button class="tab" data-tab="econ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l5 3V9l5 3V9l5 3v9z"/><path d="M3 21h18"/></svg>
            <span>经济</span>
            <span class="tab-badge" id="badge-econ" hidden></span>
          </button>
          <button class="tab" data-tab="tech">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 14h9"/></svg>
            <span>科技</span>
          </button>
          <button class="tab" data-tab="focus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M6 4h12l-2.5 4L18 12H6"/></svg>
            <span>国策</span>
          </button>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </aside>
    </div>

    <!-- 底部：事件日志 -->
    <footer id="logbar">
      <div class="log-title">事件日志</div>
      <div id="log" class="log"></div>
    </footer>

    <!-- 移动端常驻结束回合按钮 -->
    <button id="btn-endturn-fab" class="btn btn-green endturn-fab" title="结束回合">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span>结束回合</span>
    </button>
  </section>

  <!-- 新手引导 -->
  <div id="tutorial" class="tutorial" hidden>
    <div class="tut-card">
      <div class="tut-step" id="tut-step"></div>
      <div class="tut-text" id="tut-text"></div>
      <div class="tut-actions">
        <button class="btn btn-mini" id="tut-skip">跳过</button>
        <button class="btn btn-green btn-mini" id="tut-next">下一步</button>
      </div>
    </div>
  </div>

  <!-- 即时反馈浮层 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- 宣战 / 被宣战 全屏闪屏反馈 -->
  <div id="screen-flash" class="screen-flash"></div>

  <!-- 模态弹窗（菜单 / 说明 / 结算） -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modal-box"></div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
