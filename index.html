<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁雄心 · 浏览器版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen">
  <div class="panel">
    <h1>钢 铁 雄 心</h1>
    <div class="sub">HEARTS OF IRON · BROWSER EDITION</div>
    <label>选择国家</label>
    <select id="selCountry"></select>
    <label>剧本</label>
    <select id="selScenario">
      <option value="1936">1936 · 战争之路</option>
    </select>
    <label>难度</label>
    <select id="selDifficulty">
      <option value="recruit">新兵</option>
      <option value="regular" selected>正规</option>
      <option value="veteran">老兵</option>
    </select>
    <div class="diff-desc" id="diffDesc"></div>
    <button id="btnStart">开始游戏</button>
    <button id="btnContinue" style="margin-top:10px;background:linear-gradient(180deg,#3a5a3a,#2a4a2a);display:none">继续游戏</button>
  </div>
</div>

<!-- 顶部栏 -->
<div id="topbar" class="hidden">
  <div class="tb-side">
    <div id="topBarCountry">
      <div class="flag" id="topBarFlag"></div>
      <div class="name" id="topBarName"></div>
    </div>
    <div class="tb-stat" title="政治权力"><span class="res-ic pp">◈</span><span class="val" id="tbPP">0</span></div>
    <div class="tb-stat" title="稳定度"><span class="res-ic stab">☮</span><span class="val" id="tbStab">0%</span></div>
    <div class="tb-stat" title="战争支援度"><span class="res-ic ws">⚔</span><span class="val" id="tbWS">0%</span></div>
    <div class="tb-stat" title="民用工厂"><span class="res-ic civ">⚙</span><span class="val" id="tbCiv">0</span></div>
    <div class="tb-stat" title="军用工厂"><span class="res-ic mil">🏭</span><span class="val" id="tbMil">0</span></div>
    <div class="tb-stat" title="装备"><span class="res-ic equip">🔫</span><span class="val" id="tbEquip">0</span></div>
    <div class="tb-stat" title="人力"><span class="res-ic man">👤</span><span class="val" id="tbMan">0</span></div>
    <div class="tb-stat" title="钢铁"><span class="res-ic res">⛏</span><span class="val" id="tbRes">0</span></div>
    <div class="tb-stat" title="石油"><span class="res-ic oil">🛢</span><span class="val" id="tbOil">0</span></div>
    <div class="tb-stat" title="稀有材料"><span class="res-ic rare">💎</span><span class="val" id="tbRare">0</span></div>
  </div>
  <div id="topBarDate">1936年01月</div>
  <div id="topBarSpeed">
    <button data-s="0">❚❚</button>
    <button data-s="1">1</button>
    <button data-s="2">2</button>
    <button data-s="3">3</button>
    <button data-s="4">4</button>
    <button data-s="5">▶▶</button>
  </div>
  <div id="topBarRight">
    <button class="tb-btn" id="btnFocus">国策</button>
    <button class="tb-btn" id="btnTech">科研</button>
    <button class="tb-btn" id="btnDiplo">外交</button>
    <button class="tb-btn danger" id="btnSurrender">投降</button>
  </div>
</div>

<!-- 地图 -->
<div id="mapWrap" class="hidden">
  <svg id="mapSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="oceanGrad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#0f2236"/>
        <stop offset="100%" stop-color="#070e18"/>
      </radialGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
    </defs>
    <rect width="1000" height="500" fill="url(#oceanGrad)"/>
    <g id="layerOcean"></g>
    <g id="layerLand"></g>
    <g id="layerTerritory"></g>
    <g id="layerBorders"></g>
    <g id="layerSeaLinks"></g>
    <g id="layerLabels"></g>
    <g id="layerPlanHL"></g>
    <g id="layerFronts"></g>
    <g id="layerPlanArrows"></g>
    <g id="layerMovePrev"></g>
    <g id="layerAttackArrows"></g>
    <g id="layerUnits"></g>
    <g id="layerBattles"></g>
    <g id="layerEffects"></g>
    <g id="layerHilight"></g>
  </svg>
  <div class="mapmode-bar">
    <button class="mapmode-btn on" data-mode="political" title="政治地图">▣</button>
    <button class="mapmode-btn" data-mode="terrain" title="地形地图">⛰</button>
    <button class="mapmode-btn" data-mode="diplomatic" title="外交地图">☮</button>
  </div>
  <div class="zoom-ctrl">
    <button id="zoomIn" title="放大">＋</button>
    <button id="zoomOut" title="缩小">－</button>
    <button id="zoomReset" title="重置视图">⟲</button>
  </div>
  <div class="speed-indicator" id="speedLabel">已暂停</div>
  <div id="mapTooltip" class="map-tooltip"></div>
</div>

<!-- 右侧面板 -->
<div id="rightPanel" class="hidden">
  <button class="rp-close" id="rpClose">×</button>
  <div id="rpContent"></div>
</div>
<button id="panelToggle" class="hidden" title="折叠/展开面板">◀</button>

<!-- 底部日志 -->
<div id="bottomLog" class="hidden">
  <div id="logTabs">
    <div class="lt on" data-tab="all">全部</div>
    <div class="lt" data-tab="battle">战报<span class="badge hidden" id="badgeBattle">0</span></div>
    <div class="lt" data-tab="diplo">外交</div>
    <div class="lt" data-tab="event">事件</div>
    <div class="lt" data-tab="prod">生产</div>
  </div>
  <div id="logBody"></div>
</div>

<!-- 事件弹窗 -->
<div id="eventModal" class="hidden">
  <div class="panel">
    <h2 id="eventTitle"></h2>
    <p id="eventText"></p>
    <div id="eventChoices"></div>
  </div>
</div>

<!-- 提示框 -->
<div id="tooltip"></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
